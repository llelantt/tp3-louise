<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Carbu — le plein au meilleur coût</title>
    <meta
      name="description"
      content="Trouvez les stations-service les moins chères autour de vous, classées par coût réel."
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="logo" aria-hidden="true">⛽</span>
        <div>
          <h1>Carbu</h1>
          <p class="tagline">Le plein au meilleur coût, pas seulement au meilleur prix.</p>
        </div>
      </div>
      <nav class="topbar-actions">
        <a href="/docs" class="ghost-link">API / OpenAPI</a>
      </nav>
    </header>

    <main>
      <section class="card apikey-card">
        <label for="apiKey">Clé API</label>
        <div class="apikey-row">
          <input
            id="apiKey"
            type="password"
            autocomplete="off"
            placeholder="ck_… (npm run create-key -- demo)"
          />
          <button id="apiKeySave" class="btn secondary" type="button">Enregistrer</button>
          <span id="apiKeyState" class="state"></span>
        </div>
        <p class="hint">
          Stockée uniquement dans votre navigateur (localStorage). Générez-en une avec
          <code>npm run create-key -- demo</code>.
        </p>
      </section>

      <section class="card">
        <form id="searchForm" class="search-form">
          <div class="field">
            <label for="lat">Latitude</label>
            <input id="lat" name="lat" type="number" step="any" value="48.8566" required />
          </div>
          <div class="field">
            <label for="lon">Longitude</label>
            <input id="lon" name="lon" type="number" step="any" value="2.3522" required />
          </div>
          <div class="field">
            <label for="fuel">Carburant</label>
            <select id="fuel" name="fuel">
              <option value="gazole">Gazole</option>
              <option value="sp95">SP95</option>
              <option value="sp98">SP98</option>
              <option value="e10">E10</option>
              <option value="e85">E85</option>
              <option value="gplc">GPLc</option>
            </select>
          </div>
          <div class="field">
            <label for="radius">Rayon (km)</label>
            <input id="radius" name="radius_km" type="number" min="1" max="200" value="10" />
          </div>
          <div class="field">
            <label for="liters">Litres</label>
            <input id="liters" name="liters" type="number" min="1" max="200" value="50" />
          </div>
          <div class="field">
            <label for="consumption">Consommation (L/100)</label>
            <input
              id="consumption"
              name="consumption"
              type="number"
              min="1"
              max="30"
              step="0.1"
              value="6"
            />
          </div>
          <div class="field">
            <label for="sort">Trier par</label>
            <select id="sort" name="sort">
              <option value="total_cost">Coût total</option>
              <option value="price">Prix au litre</option>
              <option value="distance">Distance</option>
            </select>
          </div>
          <div class="actions">
            <button type="submit" class="btn primary">Chercher</button>
            <button type="button" id="geolocate" class="btn secondary">Ma position</button>
          </div>
        </form>
      </section>

      <section id="status" class="status" role="status" aria-live="polite"></section>

      <section id="results" class="results"></section>

      <section class="card alerts-card">
        <div class="card-head">
          <h2>Mes alertes de prix</h2>
          <button id="alertsRefresh" class="btn secondary" type="button">Rafraîchir</button>
        </div>
        <form id="alertForm" class="alert-form">
          <div class="field">
            <label for="alertFuel">Carburant</label>
            <select id="alertFuel">
              <option value="gazole">Gazole</option>
              <option value="sp95">SP95</option>
              <option value="sp98">SP98</option>
              <option value="e10">E10</option>
              <option value="e85">E85</option>
              <option value="gplc">GPLc</option>
            </select>
          </div>
          <div class="field">
            <label for="alertLat">Latitude</label>
            <input id="alertLat" type="number" step="any" value="48.8566" />
          </div>
          <div class="field">
            <label for="alertLon">Longitude</label>
            <input id="alertLon" type="number" step="any" value="2.3522" />
          </div>
          <div class="field">
            <label for="alertRadius">Rayon (km)</label>
            <input id="alertRadius" type="number" min="1" max="200" value="10" />
          </div>
          <div class="field">
            <label for="alertThreshold">Seuil (€/L)</label>
            <input id="alertThreshold" type="number" min="0.5" max="5" step="0.001" value="1.8" />
          </div>
          <div class="actions">
            <button type="submit" class="btn primary">Créer l'alerte</button>
          </div>
        </form>
        <div id="alertsList" class="alerts-list"></div>
      </section>
    </main>

    <div id="modal" class="modal" hidden>
      <div class="modal-backdrop" data-close></div>
      <div class="modal-panel" role="dialog" aria-modal="true">
        <button class="modal-close" type="button" data-close aria-label="Fermer">×</button>
        <div id="modalBody"></div>
      </div>
    </div>

    <footer>
      <p>
        Données
        <a href="https://www.prix-carburants.gouv.fr/" rel="noreferrer">prix-carburants.gouv.fr</a>
        / <a href="https://www.data.gouv.fr/" rel="noreferrer">data.gouv.fr</a> — Licence Ouverte.
      </p>
    </footer>

    <script type="module" src="/app.js"></script>
  </body>
</html>
